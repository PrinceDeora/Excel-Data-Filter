<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel Filter</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@100..900&display=swap');

        body {
            font-family: 'Roboto Condensed', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: #050332;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 20px;
            background-color: #000000;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            border-radius: 8px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
            color: white;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            font-size: 16px;
            display: block;
            margin-bottom: 5px;
            color: white;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: #2e2e2e;
            color: white;
            box-sizing: border-box;
        }

        input[type="file"] {
            display: none;
        }

        .file-upload-btn {
            display: inline-block;
            padding: 12px 20px;
            background-color: #1b14ae;
            color: white;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            text-align: center;
            width: 100%;
            box-sizing: border-box;
        }

        .file-upload-btn:hover {
            background-color: #070260;
            transition: .3s ease-in-out;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #1b14ae;
            color: white;
            font-size: 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #070260;
            transition: .3s ease-in-out;
        }

        .file-name {
            margin-top: 10px;
            color: rgb(0, 255, 21);
            font-size: 14px;
            text-align: left;
        }

        .footer {
            background-color: #000000;
            padding: 10px;
            text-align: center;
            color: white;
            position: absolute;
            bottom: 0;
            width: 100%;
        }

        .footer a {
            color: #0c00f8;
            text-decoration: none;
            margin: 0 10px;
        }

        .footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Excel Filter</h1>
        <form action="/" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="file">Upload Excel File:</label>
                <input type="file" id="file" name="file" accept=".xlsx, .xls" required onchange="displayFileName()">
                <label for="file" class="file-upload-btn">Choose File</label>
                <div id="file-name" class="file-name"></div>
            </div>
            <div class="form-group">
                <label for="name">Name to Filter:</label>
                <input type="text" id="name" name="name" placeholder="Enter name to filter" required>
            </div>
            <div class="form-group">
                <label for="columns">Input Columns:</label>
                <input type="text" id="columns" name="columns" placeholder="Enter Input Columns (e.g., X, Y, Z, etc.)" required>
            </div>
            <button type="submit">Submit</button>
        </form>
    </div>

    <div class="footer">
        Made by Prince |
        <a href="https://www.linkedin.com/in/prince-pal-singh-deora-716b5b334?" target="_blank">LinkedIn</a> |
        <a href="https://github.com/PrinceDeora" target="_blank">GitHub</a>
    </div>

    <script>
        function displayFileName() {
            const fileInput = document.getElementById('file');
            const fileName = fileInput.files[0] ? fileInput.files[0].name : '';
            document.getElementById('file-name').textContent = fileName ? `Selected file: ${fileName}` : '';
        }
    </script>
</body>

</html>
